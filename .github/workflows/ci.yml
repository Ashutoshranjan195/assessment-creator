name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @vedaai/shared build

      - name: Typecheck (backend + worker + frontend)
        run: pnpm -r typecheck

      - name: Lint backend
        run: pnpm --filter @vedaai/backend lint || echo "lint warnings"

      - name: Lint worker
        run: pnpm --filter @vedaai/worker lint || echo "lint warnings"

      - name: Lint frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
        run: pnpm --filter @vedaai/frontend lint || echo "lint warnings"

      - name: Test backend
        run: pnpm --filter @vedaai/backend test

      - name: Test worker
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm --filter @vedaai/worker test

      - name: Build backend
        run: pnpm --filter @vedaai/backend build

      - name: Build worker
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm --filter @vedaai/worker build

      - name: Build frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
        run: pnpm --filter @vedaai/frontend build

